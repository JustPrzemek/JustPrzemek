<svg xmlns="http://www.w3.org/2000/svg" width="860" height="650" viewBox="0 0 860 650" role="img" aria-label="Terminal: Przemysław Kubas — Software Engineer">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace; font-size: 14px; fill: #c9d1d9; white-space: pre; }
    .title { font-size: 12px; fill: #8b949e; }
    .user { fill: #3fb950; font-weight: bold; }
    .path { fill: #58a6ff; font-weight: bold; }
    .cmd  { fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .dir  { fill: #d2a8ff; font-weight: bold; }
    .hl   { fill: #ffa657; }
    .accent { fill: #79c0ff; }

    .l { opacity: 0; animation: show 0.01s linear forwards; }
    .c { opacity: 0; clip-path: inset(0 100% 0 0); animation: type 0.6s steps(18, end) forwards; }
    .cursor { animation: blink 1s step-end infinite; }

    @keyframes show { to { opacity: 1; } }
    @keyframes type { 0% { opacity: 1; clip-path: inset(0 100% 0 0); } 100% { opacity: 1; clip-path: inset(0 0 0 0); } }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .l, .c { opacity: 1; clip-path: none; animation: none; }
      .cursor { animation: none; }
    }
  </style>

