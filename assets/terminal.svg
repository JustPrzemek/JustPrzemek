  <text x="24" y="248" class="c" style="animation-delay:2.9s"><tspan class="user">przemek@github</tspan>:<tspan class="path">~</tspan>$ <tspan class="cmd">ls ~/stack/*</tspan></text>
  <text x="24" y="270" class="l" style="animation-delay:3.6s"><tspan class="dir">backend/  </tspan>  java  spring-boot  hibernate  jakarta-ee  postgresql  kafka  maven</text>
  <text x="24" y="292" class="l" style="animation-delay:3.75s"><tspan class="dir">testing/  </tspan>  junit5  mockito  sonarqube</text>
  <text x="24" y="314" class="l" style="animation-delay:3.9s"><tspan class="dir">security/ </tspan>  spring-security  jwt  linux  bash  wireshark</text>
