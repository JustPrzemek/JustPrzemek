  <text x="24" y="358" class="l" style="animation-delay:4.2s"><tspan class="dir">tools/    </tspan>  intellij-idea  git  postman  swagger</text>
  <text x="24" y="380" class="l" style="animation-delay:4.35s"><tspan class="dir">learning/ </tspan>  kotlin  angular  typescript  javascript</text>

  <!-- $ cat now.txt -->
  <text x="24" y="416" class="c" style="animation-delay:4.8s"><tspan class="user">przemek@github</tspan>:<tspan class="path">~</tspan>$ <tspan class="cmd">cat now.txt</tspan></text>
  <text x="24" y="438" class="l" style="animation-delay:5.5s">Exploring cloud-native patterns, web application security and Kotlin</text>
  <text x="24" y="460" class="l" style="animation-delay:5.65s">for modern backend services.</text>

  <!-- $ contact -->
  <text x="24" y="496" class="c" style="animation-delay:6.1s"><tspan class="user">przemek@github</tspan>:<tspan class="path">~</tspan>$ <tspan class="cmd">./contact.sh</tspan></text>
